name: goci

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types:
      - checks_requested

# PR code is executed only with a read-only token and no inherited secrets;
# Go and linter caches are disabled. The external-PR path is a safe-to-test label event;
# a later head update requires removing and reapplying that label.
permissions:
  contents: read

jobs:
  test:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'safe-to-test' && github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Repeat the OpenFGA startup and shutdown race regression
        run: go test -race -count=20 -failfast ./pkg/authz/openfgaserver -run '^TestProviderStartStop$'
      - name: go-test
        run: go test -race ./...
  fmt:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'safe-to-test' && github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: check-ci-contracts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: go-fmt
        shell: bash
        run: |
          unformatted=$(git ls-files -z '*.go' ':!:vendor/**' | xargs -0 gofmt -l)
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
  lint:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'safe-to-test' && github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Install the pinned full-source linter
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-only: true
          skip-cache: true
      - name: Collect the complete static lint report
        id: lint-report
        shell: bash
        run: |
          set -euo pipefail
          golangci-lint version --json > "$RUNNER_TEMP/lint-tool.json"
          go env -json GOVERSION GOOS GOARCH > "$RUNNER_TEMP/lint-go.json"
          set +e
          golangci-lint run --timeout=10m --max-same-issues=0 --max-issues-per-linter=0 \
            --uniq-by-line=false --issues-exit-code=0 --output.json.path="$RUNNER_TEMP/lint-raw.json"
          status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/lint-exit-code.txt"
          exit "$status"
      - name: Normalize static findings without source lines or runtime logs
        if: always()
        run: |
          python3 .github/scripts/lint_baseline.py normalize \
            --raw "$RUNNER_TEMP/lint-raw.json" --exit-code "$RUNNER_TEMP/lint-exit-code.txt" \
            --tool-info "$RUNNER_TEMP/lint-tool.json" --go-info "$RUNNER_TEMP/lint-go.json" \
            --config .golangci.yml --source-sha "$(git rev-parse HEAD)" \
            --output "$RUNNER_TEMP/lint-public/lint-static-findings.json"
      - name: Block unreviewed or newly introduced lint findings
        if: always()
        run: |
          python3 .github/scripts/lint_baseline.py check \
            --report "$RUNNER_TEMP/lint-public/lint-static-findings.json" \
            --baseline .github/lint-baseline.json \
            --summary "$RUNNER_TEMP/lint-public/lint-baseline-summary.json"
      - name: Retain only normalized static-analysis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-static-findings-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/lint-public/lint-static-findings.json
            ${{ runner.temp }}/lint-public/lint-baseline-summary.json
          if-no-files-found: error
          retention-days: 7
  deps:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'safe-to-test' && github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: go-deps
        run: |
          go mod tidy -diff
          go mod verify
  semconv-generated:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'safe-to-test' && github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: check-semconv-generated-files
        run: go run ./scripts/semconv -check
  build:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'safe-to-test' && github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: qemu-install
        uses: docker/setup-qemu-action@v3
      - name: aarch64-install
        run: |
          set -ex
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
      - name: node-install
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false
      - name: setup-pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
      - name: docker-community
        shell: bash
        run: |
          make docker-build-community
  openapi:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'safe-to-test' && github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: generate-openapi
        id: generate-openapi
        run: go run ./cmd/community generate openapi
      - name: Check tracked OpenAPI output
        run: |
          git diff --compact-summary --exit-code || (echo; echo "Unexpected difference in openapi spec. Run go run ./cmd/community generate openapi locally and commit."; exit 1)
      - name: Retain successful generated OpenAPI output when drift fails
        if: ${{ failure() && steps.generate-openapi.conclusion == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-openapi-${{ github.run_id }}-${{ github.run_attempt }}
          path: docs/api/openapi.yml
          if-no-files-found: error
          retention-days: 7
  authz:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'safe-to-test' && github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: generate-authz
        run: |
          go run ./cmd/community generate authz
          git diff --compact-summary --exit-code || (echo; echo "Unexpected difference in authz permissions. Run go run ./cmd/community generate authz locally and commit."; exit 1)
  web-settings:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'safe-to-test' && github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: generate-web-settings
        run: |
          go run ./cmd/community generate config web-settings
          git diff --compact-summary --exit-code || (echo; echo "Unexpected difference in web settings schema. Run go run ./cmd/community generate config web-settings locally and commit."; exit 1)
  transaction-groups:
    if: |
      github.event_name == 'merge_group' ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login != 'dependabot[bot]') ||
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'safe-to-test' && github.event.pull_request.head.repo.full_name != github.repository && contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    runs-on: ubuntu-latest
    steps:
      - name: self-checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: go-install
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: generate-transaction-groups
        run: |
          go run ./cmd/community generate config transaction-groups
          git diff --compact-summary --exit-code || (echo; echo "Unexpected difference in transaction groups schema. Run go run ./cmd/community generate config transaction-groups locally and commit."; exit 1)
