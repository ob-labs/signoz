name: Release signoz-ob image

# Builds cmd/community/Dockerfile.ob (headless SigNoz on OceanBase for the AI
# Vision stack) for linux/amd64 + linux/arm64 and pushes it to GitHub Container
# Registry as ghcr.io/<owner>/signoz-ob when a GitHub Release is published.
# Release builds use the release tag's source; manual builds use the selected
# ref. The upstream build-community.yaml (frontend-bundled Docker Hub image)
# is untouched.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Extra image tag to apply (e.g. dev)
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  IMAGE_PLATFORMS: linux/amd64,linux/arm64
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/signoz-ob

jobs:
  image:
    # Histogram quantile has its own independent release artifacts.
    if: ${{ github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'histogram-quantile/') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Bind both release and manual builds to the event's immutable commit.
          ref: ${{ github.sha }}
          persist-credentials: false

      - id: source
        name: Record checked-out build source
        env:
          BUILD_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || format('sha-{0}', github.sha) }}
        shell: bash
        run: |
          source_sha=$(git rev-parse HEAD)
          test "$source_sha" = "$GITHUB_SHA"
          printf 'sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$BUILD_VERSION" >> "$GITHUB_OUTPUT"
          printf 'timestamp=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.version=${{ steps.source.outputs.version }}
            org.opencontainers.image.created=${{ steps.source.outputs.timestamp }}
          # SigNoz owns all aliases for this package, including latest/dev/daily.
          # Only published stable releases advance the latest alias.
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name != 'release' || !github.event.release.prerelease }}
            type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/community/Dockerfile.ob
          # Go is cross-compiled inside the Dockerfile, so both platforms are
          # produced on one amd64 runner without QEMU.
          platforms: ${{ env.IMAGE_PLATFORMS }}
          build-args: |
            BUILD_VERSION=${{ steps.source.outputs.version }}
            BUILD_SHA=${{ steps.source.outputs.sha }}
            BUILD_TIMESTAMP=${{ steps.source.outputs.timestamp }}
            BUILD_REF=${{ github.ref }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Write source image build receipt
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          BUILD_VERSION: ${{ steps.source.outputs.version }}
          BUILD_TIMESTAMP: ${{ steps.source.outputs.timestamp }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        shell: bash
        run: |
          docker buildx imagetools inspect "$IMAGE_NAME@$IMAGE_DIGEST" --raw > signoz-ob-image-index.json
          python3 .github/scripts/signoz_ob_provenance.py --manifest signoz-ob-image-index.json --output signoz-ob-build-receipt.json

      - name: Upload source image build receipt
        uses: actions/upload-artifact@v4
        with:
          name: signoz-ob-build-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: signoz-ob-build-receipt.json
          if-no-files-found: error
